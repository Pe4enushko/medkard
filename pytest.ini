[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = src .
norecursedirs = e2e *.egg .* _darcs build CVS dist node_modules venv {arch}
markers =
    integration: hits a configured external service such as Postgres
    slow: runs a real audit and may consume LLM tokens (stand only)
