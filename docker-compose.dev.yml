name: medkard-dev

# Local dev database for the audit pipeline and the e2e suite. Bound to the
# loopback interface only: nothing here is reachable from the network, which is
# why trust auth is acceptable and no password lives in this file. The app role
# still gets a real password — scripts/dev/deploy_dev.sh generates it and writes
# it to .env.dev, so a switched .env is a working .env.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: medkard-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    # Соединений нужно больше, чем 100 по умолчанию. Один прогон аудита держит
    # три независимых пула — asyncpg в vector_store, psycopg в BaseStorage и пул
    # клинреков, — и это умножается на число одновременно идущих карт. На проде
    # это уже стоило 127 карт, ушедших в broken с
    # «asyncpg.exceptions.TooManyConnectionsError: sorry, too many clients
    # already» (18–26.09.2026); там лимит подняли, стенд не должен наступать на
    # те же грабли. Переопределяется MEDKARD_DEV_MAX_CONNECTIONS.
    command:
      - postgres
      - -c
      - max_connections=${MEDKARD_DEV_MAX_CONNECTIONS:-300}
    ports:
      - "127.0.0.1:${MEDKARD_DEV_PORT:-55432}:5432"
    volumes:
      - medkard-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  medkard-dev-db:
